openapi: 3.0.0
info:
  title: SRGSSR Video
  description: >
    This API provides Video Metadata (incl. subtitles) from RSI, RTS, RTS, SRF, SWI.
  contact:
    name: API Developer
    url: https://developer.srgssr.ch
    email: api@srgssr.ch
  version: '2.0.4'
servers:
- url: https://api.srgssr.ch/videometadata/v2
  variables: {}
- url: http://api.srgssr.ch/videometadata/v2
  variables: {}
- url: https://srgssr-prod.apigee.net/oauth/v1
  variables: {}
paths:
  /tv_shows/alphabetical:
    get:
      tags:
      - TvShows
      summary: tvshowsByAlphabetical
      description: Returns TV shows according to an editorially managed list.
      operationId: tvshowsByAlphabetical
      parameters:
      - name: bu
        in: query
        description: Business unit
        required: true
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/bu'
          - description: Business unit
      - name: characterFilter
        in: query
        description: 'One character (a-z) or # for everything else that is used to filter.'
        required: true
        style: form
        explode: true
        schema:
          pattern: '[a-z#]{1}'
          type: string
      - name: accept
        in: header
        description: ''
        style: simple
        schema:
          allOf:
          - $ref: '#/components/schemas/accept'
          - {}
      - name: callback
        in: query
        description: If this parameter is set, the result will be returned as [JSONP](https://en.wikipedia.org/wiki/JSONP). The given value will be used as the name of the method to be called.
        style: form
        explode: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: >-
          The number of items that should be returned per page. Only supported on the request to the first page!


          **Note:** To receive a unlimited list, set the pageSize to "unlimited".
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: next
        in: query
        description: Encoded reference to the next page. Clients must not assemble this at their own but just use the next-link provided as part of the payload of every response.
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: Object of type ShowList
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/ShowList'
                - xml:
                    name: ShowList
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/ShowList'
        '203':
          description: The returned object is the same as in a 200 response, but some, non-mandatory, values may be missing.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/ShowList'
                - xml:
                    name: ShowList
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/ShowList'
        '400':
          description: Object of type missingParam.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/missingParam'
                - xml:
                    name: missingParam
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/missingParam'
        '401':
          description: Object of type tokenError
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/tokenError'
                - xml:
                    name: tokenError
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/tokenError'
        '403':
          description: Object of type quotaViolation.
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/quotaViolation'
                - xml:
                    name: quotaViolation
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/quotaViolation'
        '405':
          description: Object of type methodNotAllowed
          headers: {}
          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/methodNotAllowed'
                - xml:
                    name: methodNotAllowed
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/methodNotAllowed'
        '404':
          description: Object of type unknownResource.
