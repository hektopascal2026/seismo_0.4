          content:
            application/xml:
              schema:
                allOf:
                - $ref: '#/components/schemas/unknownResource'
                - xml:
                    name: unknownResource
                    attribute: false
                    wrapped: false
            application/json:
              schema:
                $ref: '#/components/schemas/unknownResource'
        default:
