  /episodes_by_date/{day}:
    get:
      tags:
      - Episodes
      summary: episodesByDate
      description: Returns a list of the latest episodes for the given date.
      operationId: episodesByDate
      parameters:
      - name: bu
        in: query
        description: Business unit
        required: true
        style: form
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/bu'
          - description: Business unit
      - name: day
        in: path
        description: A ISO-8601 date (YYYY-MM-DD).
        required: true
        style: simple
        schema:
          type: string
          format: date
      - name: accept
        in: header
        description: ''
        style: simple
        schema:
          allOf:
          - $ref: '#/components/schemas/accept'
          - {}
      - name: callback
        in: query
        description: If this parameter is set, the result will be returned as [JSONP](https://en.wikipedia.org/wiki/JSONP). The given value will be used as the name of the method to be called.
        style: form
        explode: true
        schema:
          type: string
      - name: timerange
        in: query
        description: Timerange within the day in the format hh:mm-hh:mm)
        style: form
        explode: true
        schema:
          pattern: '[0-9]{2}:[0-9]{2}-[0-9]{2}:[0-9]{2}'
          type: string
          example: 12:00-12:30
      - name: pageSize
        in: query
        description: The number of items that should be returned per page. Only supported on the request to the first page!
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: next
        in: query
        description: Encoded reference to the next page. Clients must not assemble this at their own but just use the next-link provided as part of the payload of every response.
